<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address List Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="widget" id="widgetRoot">
    <div class="widget-header">
      <div>
        <h2 id="widgetTitle">Addresses</h2>
        <p id="widgetSubtitle">Add as many locations as needed.</p>
      </div>
    </div>

    <section class="editor" id="editorSection">
      <div class="grid">
        <div class="full-width">
          <label for="nickname">Nickname <span class="optional">(optional)</span></label>
          <input id="nickname" type="text" autocomplete="off" />
        </div>

        <div>
          <label for="street1" id="street1Label">Street 1<span class="required">*</span></label>
          <input id="street1" type="text" autocomplete="street-address" />
        </div>

        <div id="street2Wrap">
          <label for="street2">Street 2 <span class="optional">(optional)</span></label>
          <input id="street2" type="text" autocomplete="address-line2" />
        </div>

        <div>
          <label for="city">City<span class="required">*</span></label>
          <input id="city" type="text" autocomplete="address-level2" />
        </div>

        <div>
          <label for="state">State<span class="required">*</span></label>
          <select id="state">
            <option value="">Select state</option>
          </select>
        </div>

        <div>
          <label for="zip">ZIP<span class="required">*</span></label>
          <input id="zip" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="10" />
        </div>

        <div>
          <label for="county">County / Planning Region<span class="required">*</span></label>
          <input id="county" type="text" autocomplete="off" />
        </div>
      </div>

      <div id="housingFields" class="mode-panel" hidden>
        <div class="small-row">
          <div>
            <label>Type<span class="required">*</span></label>
            <div class="segmented-control" role="group" aria-label="Housing type">
              <button id="housingEmployerOwnedBtn" class="segment active" type="button">Employer-owned</button>
              <button id="housingRentedBtn" class="segment" type="button">Rented</button>
            </div>
          </div>

          <div>
            <label for="units">Units<span class="required">*</span></label>
            <input id="units" type="number" min="1" step="1" inputmode="numeric" />
          </div>

          <div>
            <label for="occupancy">Occupancy<span class="required">*</span></label>
            <input id="occupancy" type="number" min="1" step="1" inputmode="numeric" />
          </div>
        </div>
      </div>

      <div id="worksiteFields" class="mode-panel" hidden>
        <div class="small-row">
          <label class="checkbox-row" for="ownedByEmployer">
            <input id="ownedByEmployer" type="checkbox" checked />
            Owned by Employer
          </label>

          <div id="ownedByWrap" hidden>
            <label for="ownedBy">Owned By<span class="required">*</span></label>
            <input id="ownedBy" type="text" autocomplete="off" />
          </div>
        </div>

        <div class="small-row">
          <div>
            <label for="startDate">Start Date <span class="optional">(optional)</span></label>
            <input id="startDate" type="date" />
          </div>

          <div>
            <label for="endDate">End Date <span class="optional">(optional)</span></label>
            <input id="endDate" type="date" />
          </div>

          <div>
            <label for="workers">Workers <span class="optional">(optional)</span></label>
            <input id="workers" type="number" min="0" step="1" inputmode="numeric" />
          </div>
        </div>
      </div>

      <div class="action-row">
        <button id="saveBtn" type="button">+ Add Address</button>
        <button id="cancelEditBtn" class="secondary-btn" type="button" hidden>Cancel Edit</button>
      </div>

      <div id="formError" class="error" aria-live="polite"></div>
    </section>

    <section class="address-list-section">
      <div class="list-heading-row">
        <h3 id="listHeading">Added Addresses</h3>
        <span id="addressCount" class="count-badge">0</span>
      </div>
      <div id="addressList" class="address-list"></div>
    </section>

    <div id="globalError" class="error" aria-live="polite"></div>
  </div>

  <script src="states.js"></script>
  <script src="address-widget.js?v=4"></script>
</body>
</html>
